<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The plugin's window. code.js reads the file and sends the list here; this page only shows it
  and copies it. Everything is in this one file: Figma shows it in a frame with no address, so it
  can't load other files, and it loads nothing from the web either.
-->
<style>
  :root {
    /* Figma's own colors (themeColors in code.js), so light and dark follow Figma. */
    --bg: var(--figma-color-bg, #ffffff);
    --bg-hover: var(--figma-color-bg-hover, #f5f5f5);
    --bg-selected: var(--figma-color-bg-selected, #e5f4ff);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, #6b6b6b);
    --text-3: var(--figma-color-text-tertiary, #8c8c8c);
    --border: var(--figma-color-border, #e6e6e6);
    --focus: var(--figma-color-border-selected, #0d99ff);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --tip-bg: #1e1e1e;
    --tip-text: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 12px/16px Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  header { display: flex; gap: 8px; padding: 12px 12px 8px; }
  .scopes { display: flex; flex: 1; padding: 2px; border: 1px solid var(--border); border-radius: 6px; }
  .scopes label {
    position: relative;
    flex: 1;
    padding: 4px 6px;
    border-radius: 4px;
    text-align: center;
    white-space: nowrap;
    color: var(--text-2);
  }
  .scopes label:hover { color: var(--text); }
  .scopes label:has(input:checked) { background: var(--bg-selected); color: var(--text); font-weight: 600; }
  .scopes label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: -2px; }
  .scopes input { position: absolute; inset: 0; margin: 0; opacity: 0; }

  button {
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    white-space: nowrap;
  }
  button:hover { background: var(--bg-hover); }
  button.primary { border-color: transparent; background: var(--brand); color: var(--on-brand); font-weight: 600; }
  /* Greyed out but still focusable, so its tooltip can say why. */
  button[aria-disabled="true"] { opacity: 0.4; background: transparent; }
  button.primary[aria-disabled="true"] { background: var(--brand); }

  #summary { margin: 0; padding: 0 12px 8px; min-height: 24px; color: var(--text-2); }
  main { flex: 1; overflow-y: auto; border-top: 1px solid var(--border); }
  main[aria-busy="true"] { opacity: 0.5; }
  ul { margin: 0; padding: 0; list-style: none; }
  #families { padding: 4px 0 8px; }
  .family { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px 2px; }
  .family .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
  .family .meta { color: var(--text-3); white-space: nowrap; }
  .style { display: flex; gap: 12px; align-items: baseline; padding: 2px 12px 2px 24px; }
  .style .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .style .layers { color: var(--text-3); white-space: nowrap; }
  .mark { width: 56px; text-align: right; white-space: nowrap; color: var(--text-3); }
  .mark.missing { color: var(--danger); font-weight: 600; }

  footer { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid var(--border); }
  footer button { flex: 1; padding: 0 6px; }

  #tip {
    position: fixed;
    z-index: 2;
    max-width: 240px;
    padding: 4px 8px;
    border-radius: 4px;
    background: var(--tip-bg);
    color: var(--tip-text);
    font-size: 11px;
    pointer-events: none;
  }
  #manual {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: var(--bg);
  }
  #manual p { margin: 0; }
  #manual textarea { flex: 1; resize: none; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; }
  #manual button { align-self: flex-end; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Off screen, not hidden: copying needs a text box the page can select. */
  #clip { position: fixed; top: 0; left: -10000px; width: 10px; height: 10px; opacity: 0; }
</style>
</head>
<body>
  <header>
    <div class="scopes" role="radiogroup" aria-label="List fonts from">
      <label data-tip="scope-all"><input type="radio" name="scope" value="all" checked>All pages</label>
      <label data-tip="scope-page"><input type="radio" name="scope" value="page">This page</label>
      <label data-tip="scope-selection"><input type="radio" name="scope" value="selection">Selection</label>
    </div>
    <button id="refresh" type="button" data-tip="refresh">Refresh</button>
  </header>
  <p id="summary" role="status">Reading fonts…</p>
  <main id="list" aria-busy="true" aria-label="Fonts">
    <ul id="families"></ul>
  </main>
  <footer>
    <button id="copy-missing" class="primary" type="button" data-tip="copy-missing">Copy missing</button>
    <button id="copy-all" type="button" data-tip="copy-all">Copy all</button>
    <button id="copy-json" type="button" data-tip="copy-json">Copy as JSON</button>
  </footer>

  <div id="manual" role="dialog" aria-modal="true" aria-labelledby="manual-text" hidden>
    <p id="manual-text"></p>
    <textarea id="manual-copy" readonly aria-label="Text to copy"></textarea>
    <button id="manual-done" type="button" data-tip="manual-done">Done</button>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="said" class="sr" aria-live="polite"></div>
  <textarea id="clip" aria-hidden="true" tabindex="-1"></textarea>

<script>
  "use strict";
  const $ = (id) => document.getElementById(id);
  const MAC = /Mac/.test(navigator.platform);

  /* ---- Tooltips: the words for each control, plus why it's greyed out ---- */

  const TIPS = {
    "scope-all": "Lists the fonts on every page of this file. A big file takes a moment to read.",
    "scope-page": "Lists the fonts on the page you're on",
    "scope-selection": "Lists the fonts in the selected layers and the layers inside them",
    refresh: "Reads the fonts again, after you change the file. Fonts turned on in Fontface show once you reload this file's tab.",
    "copy-missing": "Copies the missing fonts, one \"Family Style\" per line, to paste into Fontface",
    "copy-all": "Copies every font listed, one \"Family Style\" per line, to paste into Fontface",
    "copy-json": "Copies every font listed as JSON, with each font's family and style",
    "manual-done": "Closes this and goes back to the list (Esc)",
  };
  /** Why a greyed-out control is greyed out, by its data-tip (absent while it works). */
  const why = {};

  const tip = $("tip");
  const TIP_DELAY = 500; // how long the pointer rests on a control before its tooltip opens
  const TIP_INSTANT = 400; // after one closes, the next opens at once for this long
  let tipFor = null; // the control whose tooltip is open or about to open
  let tipTimer = 0;
  let tipClosedAt = 0;

  const tipWords = (el) => why[el.dataset.tip] || TIPS[el.dataset.tip];

  /** Screen readers hear the tooltip's words as the control's description. */
  function describe(el) {
    const id = "tip-" + el.dataset.tip;
    let words = $(id);
    if (!words) {
      words = document.createElement("span");
      words.id = id;
      words.className = "sr";
      document.body.append(words);
      (el.querySelector("input") || el).setAttribute("aria-describedby", id);
    }
    words.textContent = tipWords(el);
    if (tipFor === el && !tip.hidden) tip.textContent = tipWords(el);
  }

  /** Shows the tooltip above `el` (below if there's no room), inside the window. */
  function placeTip(el) {
    tip.textContent = tipWords(el);
    tip.hidden = false;
    const at = el.getBoundingClientRect();
    const size = tip.getBoundingClientRect();
    const left = Math.min(Math.max(8, at.left + at.width / 2 - size.width / 2), innerWidth - size.width - 8);
    const above = at.top - size.height - 6;
    tip.style.left = left + "px";
    tip.style.top = (above >= 8 ? above : at.bottom + 6) + "px";
  }

  function openTip(el) {
    if (tipFor === el) return;
    closeTip();
    tipFor = el;
    const wait = Date.now() - tipClosedAt < TIP_INSTANT ? 0 : TIP_DELAY;
    tipTimer = setTimeout(() => placeTip(el), wait);
  }

  function closeTip() {
    clearTimeout(tipTimer);
    if (!tip.hidden) tipClosedAt = Date.now();
    tip.hidden = true;
    tipFor = null;
  }

  document.addEventListener("pointerover", (event) => {
    const el = event.target.closest("[data-tip]");
    if (el) openTip(el);
    else closeTip();
  });
  document.documentElement.addEventListener("pointerleave", closeTip);
  // Keyboard focus shows the tooltip as hover does; a click doesn't, nor coming back from a copy.
  document.addEventListener("focusin", (event) => {
    const el = event.target.closest("[data-tip]");
    if (el && event.target.matches(":focus-visible") && event.relatedTarget !== $("clip")) openTip(el);
    else closeTip();
  });
  document.addEventListener("focusout", closeTip);
  document.addEventListener("pointerdown", closeTip);

  /* ---- Showing the list from code.js ---- */

  const buttons = { missing: $("copy-missing"), all: $("copy-all"), json: $("copy-json") };
  let result = null; // the last "result" message, with the texts to copy
  let busy = true;

  const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
  const chosenScope = () => document.querySelector('input[name="scope"]:checked').value;

  function send(message) {
    parent.postMessage({ pluginMessage: message }, "*");
  }

  function summaryText(r) {
    if (r.nothingSelected) return "Select layers to list the fonts in them.";
    if (r.layers === 0) {
      if (r.scope === "selection") return "No text in the selected layers.";
      return r.scope === "page" ? "No text layers on this page." : "No text layers in this file.";
    }
    let text = plural(r.fonts, "font") + " in " + plural(r.layers, "text layer");
    text += r.missing ? ". " + r.missing + " missing: Figma can't find them." : ", all available.";
    if (r.unreadable) text += " " + plural(r.unreadable, "layer") + " couldn't be read.";
    return text;
  }

  /** A `tag` element holding one span per [class, text]. */
  function line(tag, className, parts) {
    const el = document.createElement(tag);
    el.className = className;
    for (const [part, text] of parts) {
      const span = document.createElement("span");
      span.className = part;
      span.textContent = text; // text, never HTML: font names can hold any character
      el.append(span);
    }
    return el;
  }

  /** Each family's name, then a line per style: layers using it, and Missing or Available. */
  function showList(families) {
    const list = $("families");
    list.replaceChildren();
    for (const family of families) {
      const item = document.createElement("li");
      const meta = plural(family.styles.length, "style") + (family.missing ? " · " + family.missing + " missing" : "");
      item.append(line("div", "family", [["name", family.family], ["meta", meta]]));
      const styles = document.createElement("ul");
      styles.setAttribute("aria-label", family.family);
      for (const font of family.styles) {
        styles.append(
          line("li", "style", [
            ["name", font.style],
            ["layers", plural(font.layers, "layer")],
            [font.missing ? "mark missing" : "mark", font.missing ? "Missing" : "Available"],
          ]),
        );
      }
      item.append(styles);
      list.append(item);
    }
  }

  /** Greys out what can't be copied now, with the reason in its tooltip. */
  function updateButtons() {
    let none = null;
    if (busy) none = "Wait: still reading the file";
    else if (!result) none = "Nothing to copy: the fonts couldn't be read. Try Refresh.";
    else if (result.nothingSelected) none = "Select some layers to list their fonts";
    else if (result.fonts === 0) none = "Nothing to copy: there's no text here";
    why["copy-all"] = why["copy-json"] = none;
    why["copy-missing"] = none || (result.missing === 0 ? "Nothing is missing: Figma has every font listed" : null);
    for (const [key, button] of Object.entries(buttons)) {
      button.setAttribute("aria-disabled", String(!!why["copy-" + key]));
      describe(button);
    }
  }

  onmessage = (event) => {
    const message = event.data.pluginMessage;
    // Only the scope chosen now: a reply to an earlier choice can still be on its way.
    if (!message || message.scope !== chosenScope()) return;
    busy = message.type === "busy";
    $("list").setAttribute("aria-busy", String(busy));
    if (message.type === "busy") {
      $("summary").textContent = message.text;
    } else if (message.type === "error") {
      result = null;
      $("summary").textContent = message.text;
      showList([]);
    } else if (message.type === "result") {
      result = message;
      $("summary").textContent = summaryText(message);
      showList(message.families);
    }
    updateButtons();
  };

  /* ---- Choosing what to list ---- */

  for (const radio of document.querySelectorAll('input[name="scope"]')) {
    radio.addEventListener("change", () => send({ type: "read", scope: radio.value }));
  }
  $("refresh").addEventListener("click", () => send({ type: "read", scope: chosenScope() }));

  /* ---- Copying ---- */

  // Figma's plugin window isn't allowed the modern clipboard call, so copy the old way: put the
  // text in a text box, select it, and ask the page to copy the selection.
  function copyText(text) {
    const clip = $("clip");
    clip.value = text;
    clip.focus();
    clip.select();
    let copied = false;
    try {
      copied = document.execCommand("copy");
    } catch (e) {
      copied = false;
    }
    clip.value = "";
    return copied;
  }

  let manualFrom = null; // the button to go back to when the manual copy closes
  /** What the manual copy covers: out of reach of the keyboard (and screen readers) while it's
   *  open, so Tab can't land on a control you can't see. */
  const covered = () => document.querySelectorAll("body > header, #summary, body > main, body > footer");

  /** If copying is refused, show the text selected, ready for Command-C. */
  function copyByHand(text, from) {
    manualFrom = from;
    $("manual-text").textContent =
      "Figma didn't let the plugin copy. Press " + (MAC ? "⌘C" : "Ctrl+C") + " to copy this text.";
    for (const el of covered()) el.inert = true;
    $("manual").hidden = false;
    const box = $("manual-copy");
    box.value = text;
    box.focus();
    box.select();
  }

  function closeManual() {
    $("manual").hidden = true;
    for (const el of covered()) el.inert = false;
    if (manualFrom) manualFrom.focus();
    manualFrom = null;
  }
  $("manual-done").addEventListener("click", closeManual);

  const COPIED = {
    missing: (n) => "Copied " + plural(n, "missing font"),
    all: (n) => "Copied " + plural(n, "font"),
    json: (n) => "Copied " + plural(n, "font") + " as JSON",
  };

  for (const [key, button] of Object.entries(buttons)) {
    button.addEventListener("click", () => {
      closeTip();
      if (button.getAttribute("aria-disabled") === "true" || !result) return;
      const text = result.copy[key];
      if (!copyText(text)) return copyByHand(text, button);
      button.focus();
      const said = COPIED[key](key === "missing" ? result.missing : result.fonts);
      $("said").textContent = said;
      send({ type: "notify", text: said });
    });
  }

  // Esc closes the tooltip and, in the same press, the manual copy if it's open.
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    closeTip();
    if (!$("manual").hidden) closeManual();
  });

  for (const el of document.querySelectorAll("[data-tip]")) describe(el);
  updateButtons();
</script>
</body>
</html>
