[package]
name = "fontface"
version = "0.1.0"
description = "A subscription-free font manager"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "fontface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: a see-through window (translucency.rs). A no-op since Tauri 2.12.1, which
# always allows it; kept so tauri.conf.json's macOSPrivateApi and the features agree.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
# gvar-alloc: without it, outlines fail for variable fonts with many variation tuples (SF Pro,
# Roboto Flex), and previews would wrongly decide those fonts can't draw their names.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
ureq = "2"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# Unicode normalisation, so a name written with accents as separate marks (as file names from
# older Mac disks are) matches the same name written with accented letters. Already in
# Cargo.lock (URL handling uses it); listed so the name matcher can use it directly.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# statfs, to tell a disk image (read-only) from a writable drive for "Open at login".
libc = "0.2"
core-text = "21"
plist = "1"
xattr = "1"
# Finder tags (NSURL) and Font Book collections (NSFontCollection), for tag import and export.
# NSNotification: knowing when the window has left full screen (window.rs).
# NSAccessibility and NSWorkspace: following Reduce transparency (translucency.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSObjCRuntime", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSFontCollection", "NSFontDescriptor", "NSWorkspace"] }
# The auto-activation test's callback is an Objective-C block (font_requests/listen.rs). block2
# was already in Cargo.lock (the objc2 crates use it); listed so Fontface can use it directly.
block2 = "0.6"
