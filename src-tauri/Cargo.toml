[package]
name = "fontface"
version = "0.1.0"
description = "A subscription-free font manager"
edition = "2021"

[lib]
name = "fontface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
ttf-parser = "0.25"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
ureq = "2"
notify = "8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# statfs, to tell a disk image (read-only) from a writable drive for "Open at login".
libc = "0.2"
core-text = "21"
plist = "1"
xattr = "1"
# Finder tags (NSURL) and Font Book collections (NSFontCollection), for tag import and export.
# NSNotification: knowing when the window has left full screen (window.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSNotification", "NSObjCRuntime", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSFontCollection", "NSFontDescriptor"] }
