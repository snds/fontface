# Checks every push to main and every pull request on macOS, the platform Fontface ships on:
# types, the UI tests, the front-end build, then the Rust tests. Windows and Linux jobs come once
# their code first compiles (docs/FEATURES.md lists them as designed for, not built).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # Publishes each push to main as the rolling `fontface-main` pre-release on snds/releases, signed
  # with Fontface's update key (README.md → Updates), through the update kit's reusable workflow
  # (pinned; its README → Releasing). Without the secrets it's a dry run that builds and says which
  # secret is missing; it never fails a push for one. Pull requests don't run it.
  release-main:
    if: github.event_name == 'push'
    needs: macos
    permissions:
      contents: read
    uses: snds/app-updates/.github/workflows/release-main.yml@4164991dd62f6d31dd99c2444906c8de53f6a719
    with:
      app: fontface
      tauri-dir: src-tauri
      # Fontface ships on macOS only for now (docs/FEATURES.md).
      platforms: '["macos-universal"]'
      package-manager: npm
      kit-ref: 4164991dd62f6d31dd99c2444906c8de53f6a719
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
