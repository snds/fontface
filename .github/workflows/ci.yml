# Checks every push to main and every pull request on macOS, the platform Fontface ships on:
# types, the UI tests, the front-end build, then the Rust tests. Windows and Linux jobs come once
# their code first compiles (docs/FEATURES.md lists them as designed for, not built).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ui
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # Publishes each push to main as the rolling `fontface-main` pre-release on snds/releases, signed
  # with Fontface's update key (README.md → Updates). Without the secrets it's a dry run that
  # builds and says which secret is missing; it never fails a push for one.
  release-main:
    # Turn on once snds/app-updates' release-main workflow is merged: replace `false` with
    # `github.event_name == 'push' && github.ref == 'refs/heads/main'` (pushes to main only).
    if: false
    needs: macos
    permissions:
      contents: read
    uses: snds/app-updates/.github/workflows/release-main.yml@main
    with:
      app: fontface
      tauri-dir: src-tauri
      platforms: '["macos-universal"]'
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
